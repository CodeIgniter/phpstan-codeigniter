name: Coding Standards Check

on:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - '*.x'
    paths:
      - '.github/workflows/test-coding-standards.yml'
      - '**.php'
      - 'composer.json'
  push:
    branches:
      - '*.x'
    paths:
      - '.github/workflows/test-coding-standards.yml'
      - '**.php'
      - 'composer.json'

jobs:
  coding-standards:
    name: Coding Standards Check [PHP ${{ matrix.php-version }}]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version:
          - '8.5'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
            persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: tokenizer
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.composer-cache.outputs.COMPOSER_CACHE_FILES_DIR }}
          key: composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.*') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-
            composer-

      - name: Setup Composer's GitHub OAuth access
        run: composer config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies on tools
        run: |
          composer update --ansi
          composer audit --ansi

      - name: Run PHP CS Fixer
        run: vendor/bin/php-cs-fixer check --verbose --ansi --diff
