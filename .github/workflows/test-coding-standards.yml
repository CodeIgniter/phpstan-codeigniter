name: Coding Standards Check

on:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - '*.x'
    paths:
      - '.github/workflows/test-coding-standards.yml'
      - '**.php'
      - 'composer.json'
  push:
    branches:
      - '*.x'
    paths:
      - '.github/workflows/test-coding-standards.yml'
      - '**.php'
      - 'composer.json'

jobs:
  coding-standards:
    name: Coding Standards Check [PHP ${{ matrix.php-version }}]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version:
          - '8.5'

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
            persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: tokenizer
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.COMPOSER_CACHE_FILES_DIR }}
          key: composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.*') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-
            composer-

      - name: Setup Composer's GitHub OAuth access
        run: composer config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies on tools
        run: |
          composer update --ansi
          composer audit --ansi --abandoned=report

      - name: Run PHP CS Fixer
        run: vendor/bin/php-cs-fixer check --verbose --ansi --diff
