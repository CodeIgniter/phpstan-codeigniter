name: PHPStan Static Analysis

on:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - '*.x'
    paths:
      - '.github/workflows/test-phpstan.yml'
      - '**.php'
      - 'composer.json'
      - 'extension.neon'
      - 'phpstan.neon.dist'
  push:
    branches:
      - '*.x'
    paths:
      - '.github/workflows/test-phpstan.yml'
      - '**.php'
      - 'composer.json'
      - 'extension.neon'
      - 'phpstan.neon.dist'

jobs:
  static-analyses:
    name: PHPStan Static Analysis [PHP ${{ matrix.php-version }}]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.5'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.COMPOSER_CACHE_FILES_DIR }}
          key: composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.*') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-
            composer-

      - name: Cache PHPStan cache directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/phpstan
          key: phpstan-${{ github.sha }}
          restore-keys: |
            phpstan-

      - name: Setup Composer's GitHub OAuth access
        run: composer config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          composer update --ansi
          composer audit --ansi --abandoned=report

      - name: Run PHPStan
        run: composer phpstan:check
