name: PHPStan Static Analysis

on:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - '*.x'
    paths:
      - '.github/workflows/test-phpstan.yml'
      - '**.php'
      - 'composer.json'
      - 'extension.neon'
      - 'phpstan.neon.dist'
  push:
    branches:
      - '*.x'
    paths:
      - '.github/workflows/test-phpstan.yml'
      - '**.php'
      - 'composer.json'
      - 'extension.neon'
      - 'phpstan.neon.dist'

jobs:
  static-analyses:
    name: PHPStan Static Analysis [PHP ${{ matrix.php-version }}]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.1'
          - '8.5'

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
            persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.composer-cache.outputs.COMPOSER_CACHE_FILES_DIR }}
          key: composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.*') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-
            composer-

      - name: Create PHPStan cache directory
        run: mkdir --parents build/phpstan

      - name: Cache PHPStan cache directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build/phpstan
          key: phpstan-${{ github.sha }}
          restore-keys: |
            phpstan-

      - name: Setup Composer's GitHub OAuth access
        run: composer config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          composer update --ansi
          composer audit --ansi --abandoned=report

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --ansi --verbose
